# ragfoundry configuration. Every option: https://github.com/rithvikkatpelly/ragfoundry#21-configuration-reference
persist_dir: storage

embeddings:
  provider: huggingface
  model: sentence-transformers/all-MiniLM-L6-v2

vector_store:
  provider: chroma
  collection_name: documents

llm:
  provider: groq
  model: ${GROQ_MODEL:-openai/gpt-oss-120b}
  temperature: 0
  # Fully local instead: provider: ollama, model: llama3.2

chunking:
  strategy: recursive
  chunk_size: 800
  chunk_overlap: 150

loading:
  on_error: skip            # a bad file is reported instead of stopping the upload

retrieval:
  top_k: 4
  fetch_k: 20
  hybrid:
    enabled: true           # keyword + vector search

context_window:
  max_context_tokens: 3000  # retrieved text sent per question
  max_history_turns: 5      # earlier chat turns sent per question
